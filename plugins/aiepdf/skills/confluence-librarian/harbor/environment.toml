# Skill-owned Harbor harness configuration for the confluence-librarian evals.
#
# This file is read by `harbor-bench convert` and deep-merged into the
# generated task.toml `[environment]` of EVERY task of this skill (on top of
# the converter defaults). evals/evals.json stays the source of truth for the
# eval cases; this is where the skill declares what its agent container needs.
#
# The evals publish and update REAL Confluence pages through the authenticated
# Atlassian MCP server. The Atlassian remote MCP authenticates with OAuth only
# (no static token; an API token gets 403 "missing scope claim" on Confluence
# tools). Obtain the credential once on the host:
#
#     npx -y -p mcp-remote@latest mcp-remote-client https://mcp.atlassian.com/v2/mcp
#
# which runs the browser authorization-code flow and stores refresh+access
# tokens under ~/.mcp-auth (mcp-remote refreshes them automatically). Nothing is
# stored in this repo: before `harbor run`, export the packed store so Harbor
# resolves the ${MCP_AUTH_B64} template below from the host environment, e.g.:
#
#     export MCP_AUTH_B64="$(tar -C ~ -czf - .mcp-auth | base64 | tr -d '\n')"
#     uv run --package harbor-bench harbor run -c <config>.yaml -y \
#       --ae COPILOT_GITHUB_TOKEN="$COPILOT_GITHUB_TOKEN"
#
# [environment].env injects MCP_AUTH_B64 at the container level — the only
# channel the Copilot CLI's MCP server process reliably inherits (agent --ae
# env does not reach it). Each container rebuilds the mcp-remote store in a
# temp dir from that env var (bash wrapper: Harbor/Copilot do not expand ${...}
# in mcp args, and a one-shot secret must not sit in the JSON config), then
# execs mcp-remote without any header — the store owns the OAuth session.
# `mcp-remote` is baked into the image by harbor/prepare.sh (Node 22).

[environment]
network_mode = "public"
env = { MCP_AUTH_B64 = "${MCP_AUTH_B64}" }

[[environment.mcp_servers]]
name = "atlassian"
transport = "stdio"
command = "bash"
args = ["-lc", "set -euo pipefail; : \"${MCP_AUTH_B64:?MCP_AUTH_B64 (packed ~/.mcp-auth) is required}\"; d=$(mktemp -d); printf '%s' \"$MCP_AUTH_B64\" | base64 -d | tar -xz -C \"$d\"; MCP_REMOTE_CONFIG_DIR=\"$d/.mcp-auth\" exec mcp-remote https://mcp.atlassian.com/v2/mcp --silent"]
