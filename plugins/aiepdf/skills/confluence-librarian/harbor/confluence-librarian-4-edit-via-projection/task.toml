schema_version = "1.4"
artifacts = [
    { source = "/workspace", exclude = [
    ".git",
] },
    "/logs/agent/copilot-cli.jsonl",
    "/logs/agent/trajectory.json",
]

[verifier]
timeout_sec = 600.0
collect = []
environment_mode = "separate"

[verifier.env]
OPENAI_API_BASE = "https://api.githubcopilot.com"
OPENAI_API_KEY = "${COPILOT_GITHUB_TOKEN}"
LITELLM_DROP_PARAMS = "true"
LITELLM_ROUTE_ALL_CHAT_OPENAI_TO_RESPONSES = "true"

[agent]
timeout_sec = 900.0

[environment]
network_mode = "public"
build_timeout_sec = 900.0
os = "linux"

[environment.env]
MCP_AUTH_B64 = "${MCP_AUTH_B64}"

[[environment.mcp_servers]]
name = "atlassian"
transport = "stdio"
command = "bash"
args = ["-lc", "set -euo pipefail; : \"${MCP_AUTH_B64:?MCP_AUTH_B64 (packed ~/.mcp-auth-atlassian) is required}\"; d=$(mktemp -d); printf '%s' \"$MCP_AUTH_B64\" | base64 -d | tar -xz -C \"$d\"; MCP_REMOTE_CONFIG_DIR=\"$d/.mcp-auth-atlassian\" exec mcp-remote https://mcp.atlassian.com/v2/mcp --silent"]

[solution.env]

[task]
name = "pagopa/confluence-librarian-4-edit-via-projection"
description = "The agent creates one fresh working copy of the large seed page and stages exactly the two cell changes on the copy's DRAFT as node-level granular edits, leaving every other element and the published "
version = "1.0.0"

[metadata]
difficulty = "medium"
category = "skill-eval"
tags = [
    "confluence-librarian",
    "skill-eval",
]
estimated_duration_sec = 900
