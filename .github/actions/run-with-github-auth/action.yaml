name: "Run with GitHub Authentication"
description: "Run a command with authenticated GitHub access for nested Git clones"

inputs:
  command:
    description: "Command that requires authenticated GitHub access"
    required: true
  github_app_token:
    description: "Preferred GitHub App installation token"
    required: false
    default: ""
  github_token:
    description: "Workflow token used when a GitHub App token is not available"
    required: true
  working_directory:
    description: "Directory where the command runs"
    required: false
    default: "."

runs:
  using: "composite"

  steps:
    - name: Run authenticated command
      shell: bash
      env:
        AUTHENTICATED_COMMAND: ${{ inputs.command }}
        # Keep the fallback token scoped to this step. The helper expands it
        # only when Git requests credentials, so it is never written to config.
        GITHUB_APP_TOKEN: ${{ inputs.github_app_token }}
        TERRAFORM_GITHUB_TOKEN: ${{ inputs.github_token }}
        # Keep credentials redacted if caller-provided env_vars enable Git tracing.
        GIT_TRACE_REDACT: 1
        # Pass config to Terraform's Git subprocesses without persisting it.
        GIT_CONFIG_COUNT: 3
        # Authenticate the first GitHub request instead of waiting for a 401.
        GIT_CONFIG_KEY_0: http.https://github.com/.proactiveAuth
        GIT_CONFIG_VALUE_0: basic
        GIT_CONFIG_KEY_1: credential.https://github.com.helper
        GIT_CONFIG_VALUE_1: "" # Reset inherited credential helpers.
        GIT_CONFIG_KEY_2: credential.https://github.com.helper
        # Prefer the explicitly provided GitHub App token, with the workflow
        # token as a fallback.
        GIT_CONFIG_VALUE_2: >-
          !f() { test "$1" = get && printf "%s\n" "username=x-access-token"
          "password=${GITHUB_APP_TOKEN:-$TERRAFORM_GITHUB_TOKEN}"; }; f
      working-directory: ${{ inputs.working_directory }}
      run: bash -euo pipefail -c "$AUTHENTICATED_COMMAND"
