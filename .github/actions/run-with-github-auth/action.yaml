name: "Run with GitHub Authentication"
description: "Run a command with authenticated GitHub access for nested Git clones"

inputs:
  command:
    description: "Command that requires authenticated GitHub access"
    required: true
  github_token:
    description: "Caller repository token used as the Git credential for module clones"
    required: false
    default: ""
  working_directory:
    description: "Directory where the command runs"
    required: false
    default: "."

runs:
  using: "composite"

  steps:
    - name: Run authenticated command
      shell: bash
      env:
        AUTHENTICATED_COMMAND: ${{ inputs.command }}
        GIT_CREDENTIAL: ${{ inputs.github_token }}
        # Fail loudly instead of hanging on an interactive credential prompt.
        GIT_TERMINAL_PROMPT: "0"
        # Keep credentials redacted from Git traces.
        GIT_TRACE_REDACT: "1"
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail

        if [ -n "$GIT_CREDENTIAL" ]; then
          # Pass config to Git subprocesses (e.g. terraform init) without persisting it. 
          # Scope is github.com so the token works for any public repository.
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0=http.https://github.com/.proactiveAuth
          export GIT_CONFIG_VALUE_0=basic
          export GIT_CONFIG_KEY_1=credential.https://github.com/.helper
          export GIT_CONFIG_VALUE_1= # Reset inherited credential helpers.
          export GIT_CONFIG_KEY_2=credential.https://github.com/.helper
          export GIT_CONFIG_VALUE_2='!f() { test "$1" = get && printf "%s\n" "username=x-access-token" "password=$GIT_CREDENTIAL"; }; f'

          # proactiveAuth needs Git >= 2.44; the credential helper alone still
          # handles the RFC 9110 401 -> retry path on older clients.
          GIT_VERSION=$(git --version | sed -E 's/git version ([0-9]+)\.([0-9]+).*/\1.\2/')
          if [ "$(printf '%s\n' "2.44" "$GIT_VERSION" | sort -V | head -1)" != "2.44" ]; then
            echo "::warning::Git $GIT_VERSION does not support http.proactiveAuth (needs >= 2.44). The credential helper still authenticates after a 401."
          fi
        else
          echo "::warning::No GitHub token provided. Git clones of any public repository will proceed anonymously and may be throttled."
        fi

        exec bash -euo pipefail -c "$AUTHENTICATED_COMMAND"
