name: "Node Setup"
description: "Setup Node.js and Turbo cache"

# To start the turbo cache, set the TURBO_CACHE_DIR environment variable to the directory where you want to store the cache.
# For example, you can set it to .turbo-cache in your project directory.

inputs:
  working_dir:
    description: "Specify the working directory"
    required: false
    default: "."

outputs:
  package-manager:
    description: "The detected package manager (npm, yarn, pnpm)"
    value: ${{ steps.detect-pm.outputs.package-manager }}

runs:
  using: "composite"

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: .node-version

    - name: Enable Corepack
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      run: |
        # On self-hosted runners the job runs as a non-root user
        # and lacks write access to /usr/bin, causing `corepack enable` to fail
        # with EACCES. Install shims into a user-writable directory instead and
        # expose it on PATH via GITHUB_PATH.
        if ! corepack enable 2>/dev/null; then
          echo "Command failed, falling back to user-local shims"
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi

    - name: Detect Node.js package manager
      id: detect-pm
      uses: pagopa/dx/actions/detect-node-package-manager@main

    - name: Resolve package manager cache
      id: package-manager-cache
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
        WORKING_DIR: ${{ inputs.working_dir }}
      run: |
        cd "$WORKING_DIR"

        case "$PACKAGE_MANAGER" in
          npm)
            cache_path=$(npm config get cache)
            lock_file=$(find . -maxdepth 1 \
              \( -name package-lock.json -o -name npm-shrinkwrap.json \) \
              -print -quit)
            ;;
          pnpm)
            cache_path=$(pnpm store path --silent)
            lock_file=$(find . -maxdepth 1 -name pnpm-lock.yaml -print -quit)
            ;;
          yarn)
            if [[ $(yarn --version) == 1.* ]]; then
              cache_path=$(yarn cache dir)
            else
              cache_path=$(yarn config get cacheFolder)
            fi
            lock_file=$(find . -maxdepth 1 -name yarn.lock -print -quit)
            ;;
          *)
            echo "::error::Unsupported package manager: $PACKAGE_MANAGER"
            exit 1
            ;;
        esac

        if [ -z "$lock_file" ]; then
          echo "::error::No lock file found for $PACKAGE_MANAGER in $WORKING_DIR"
          exit 1
        fi

        echo "path=$cache_path" >> "$GITHUB_OUTPUT"
        echo "key=$(sha256sum "$lock_file" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - name: Cache package manager
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.package-manager-cache.outputs.path }}
        key: ${{ runner.os }}-node-${{ runner.arch }}-${{ steps.detect-pm.outputs.package-manager }}-${{ steps.package-manager-cache.outputs.key }}

    - name: Setup turbo cache
      if: ${{ env.TURBO_CACHE_DIR != '' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ inputs.working_dir }}/${{ env.TURBO_CACHE_DIR }}
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Export Package Manager
      shell: bash
      env:
        package_manager: ${{ steps.detect-pm.outputs.package-manager }}
      run: |
        echo "NODE_PACKAGE_MANAGER=$package_manager" >> "$GITHUB_ENV"
