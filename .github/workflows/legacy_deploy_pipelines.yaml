name: Deploy Pipelines - Legacy

# This workflow is used by functions that do not use the monorepo
# and still use a legacy architecture that will be deprecated in the future.

on:
  workflow_call:
    inputs:
      environment:
        description: Environment where the artifact will be deployed.
        type: string
        required: true
      resource_group_name:
        description: Web App resource group name.
        type: string
        required: true
      app_name:
        description: Web App name.
        type: string
        required: true
      health_check_path:
        description: The health probe path exposed by the Function App.
        type: string
        required: false
        default: "/info"
      use_staging_slot:
        description: True if artifact should be deployed to staging slot
        type: boolean
        required: false
        default: true
      use_private_agent:
        description: Use a private agent to deploy the built artifact.
        type: boolean
        required: false
        default: true

env:
  BUNDLE_NAME: bundle

concurrency:
  group: ${{ github.workflow }}-cd
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Check-out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Build
        run: yarn predeploy
        working-directory: .

      - run: dotnet build -o bin
        working-directory: .

      - name: Copy deploy files
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7.1.0
        env:
          TARGET_FOLDER: "${{ github.workspace }}/${{ env.BUNDLE_NAME }}"
          SOURCE_FOLDER: "${{ github.workspace }}"
          CONTENTS: |
            **/*
            !.git/**/*
            !**/*.js.map
            !**/*.ts
            !__*/**/*
            !.github/**/*
            !infra/**/*
            !.vscode/**/*
            !.devops/**/*
            !azure-templates/**/*
            !azure-pipelines.yml
            !.prettierrc
            !.gitignore
            !.pre-commit-config.yaml
            !.terraform-version
            !README.md
            !CODEOWNERS
            !jest.config.js
            !local.settings.json
            !test
            !tsconfig.json
            !tslint.json
            !yarn.lock
            !Dangerfile.js
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |-
            const fs = require('fs').promises
            const path = require('path')
            const target = path.resolve(process.env.TARGET_FOLDER)

            process.chdir(process.env.SOURCE_FOLDER || '.')

            if (process.env.CLEAN_TARGET_FOLDER === 'true') await io.rmRF(target)
            const flattenFolders = process.env.FLATTEN_FOLDERS === 'true'
            const options = {force: process.env.OVERWRITE === 'true'}
            const globber = await glob.create(process.env.CONTENTS || '**')

            for await (const file of globber.globGenerator()) {
              if ((await fs.lstat(file)).isDirectory()) continue
              const filename = flattenFolders ? path.basename(file) : file.substring(process.cwd().length)
              const dest = path.join(target, filename)
              await io.mkdirP(path.dirname(dest))
              await io.cp(file, dest, options)
            }

      - name: Make Zip File
        env:
          BUNDLE_NAME: ${{ env.BUNDLE_NAME }}
        working-directory: "./${{ env.BUNDLE_NAME }}"
        run: |
          zip -r "./$BUNDLE_NAME.zip" .
          mv "$BUNDLE_NAME.zip" "../$BUNDLE_NAME.zip"

      - name: Upload Artifact
        uses: $/.github/actions/upload-artifact
        with:
          bundle_name: ${{ env.BUNDLE_NAME }}
          file_path: "${{ github.workspace }}/${{ env.BUNDLE_NAME }}.zip"

  deploy:
    if: ${{ !github.event.act }}
    needs: [build]
    runs-on: ${{ inputs.use_private_agent == true && 'self-hosted' || 'ubuntu-latest' }}
    environment: ${{ inputs.environment }}-cd
    permissions:
      id-token: write
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Artifact
        uses: $/.github/actions/download-artifact
        with:
          bundle_name: ${{ env.BUNDLE_NAME }}

      - name: Cloud Login
        uses: $/actions/csp-login
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Deploy
        if: ${{ inputs.use_staging_slot == false }}
        env:
          RESOURCE_GROUP_NAME: ${{ inputs.resource_group_name }}
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_NAME: ${{ env.BUNDLE_NAME }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --name "$APP_NAME" \
            --src-path  "$WORKSPACE/$BUNDLE_NAME.zip" \
            --type zip \
            --async false \
            | grep -v "hidden-link:"

      - name: Deploy to Staging Slot
        if: ${{ inputs.use_staging_slot == true }}
        env:
          RESOURCE_GROUP_NAME: ${{ inputs.resource_group_name }}
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_NAME: ${{ env.BUNDLE_NAME }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --name "$APP_NAME" \
            --slot staging \
            --src-path  "$WORKSPACE/$BUNDLE_NAME.zip" \
            --type zip \
            --async false \
            | grep -v "hidden-link:"

      - name: Ping Staging Health
        if: ${{ inputs.use_staging_slot == true }}
        env:
          APP_NAME: ${{ inputs.app_name }}
          HEALTH_CHECK_PATH: ${{ inputs.health_check_path }}
        run: |
          curl \
            --retry 5 \
            --retry-max-time 120 \
            --retry-all-errors \
            -f "https://$APP_NAME-staging.azurewebsites.net$HEALTH_CHECK_PATH"

      - name: Swap Staging and Production Slots
        if: ${{ inputs.use_staging_slot == true }}
        run: |
          az webapp deployment slot swap \
            -g ${{ inputs.resource_group_name }} \
            -n ${{ inputs.app_name }} \
            --slot staging \
            --target-slot production
