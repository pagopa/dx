name: "Code Review"

on:
  workflow_dispatch:
    inputs:
      oidc-cloud-probe:
        description: Run only the temporary infra-dev-ci OIDC capability proof.
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize]

jobs:
  probe-with-oidc:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.oidc-cloud-probe }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    uses: $/.github/workflows/validate-oidc-cloud-probe-v1.yaml
    with:
      expect-oidc: true
    secrets: inherit

  probe-without-oidc:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.oidc-cloud-probe }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: $/.github/workflows/validate-oidc-cloud-probe-v1.yaml
    with:
      expect-oidc: false
    secrets: inherit

  validate:
    if: ${{ github.actor != 'dx-pagopa-bot' && !(github.event_name == 'workflow_dispatch' && inputs.oidc-cloud-probe) }}
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: write
      id-token: write
    uses: $/.github/workflows/validate-v2.yaml
    secrets: inherit
