name: Release Terraform

on:
  workflow_call:

env:
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_STORAGE_USE_AZUREAD: true
  ROLE_ARN: ${{ secrets.ROLE_ARN }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_IN_AUTOMATION: true
  PNPM_CONFIG_STORE_DIR: ~/.local/share/pnpm/store
  MISE_ENV: ""

jobs:
  assess-affected-projects:
    name: Affected Projects Assessment
    runs-on: ubuntu-24.04
    outputs:
      affected-projects: ${{ steps.detect.outputs.affected-projects }}
      environments: ${{ steps.detect.outputs.environments }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "node pnpm"
          minimum_release_age: 7d

      - name: Set base and head SHAs for affected commands
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Install dependencies
        run: pnpm --filter . ci

      - name: Assess affected projects and environments
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # GitHub environments named `infra-<env>-cd` define which
          # credentials and runner labels are used for Terraform applies.
          candidate_environments="$(
            gh api \
              --paginate \
              --slurp \
              "/repos/$GITHUB_REPOSITORY/environments?per_page=100" |
              jq --compact-output '
              [
                .[].environments[]
                | select(.name | test("^infra-.+-cd$"))
                | {
                    "github-environment": .name,
                    "env-name": (.name | split("-")[1])
                  }
              ]
            '
          )"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "affected-projects=true" >> "$GITHUB_OUTPUT"
            printf 'environments=%s\n' "$candidate_environments" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          affected_projects="$(pnpm nx show projects --affected --json)"
          if ! jq --exit-status 'length > 0' <<< "$affected_projects" > /dev/null; then
            echo "affected-projects=false" >> "$GITHUB_OUTPUT"
            echo "environments=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "affected-projects=true" >> "$GITHUB_OUTPUT"

          affected_environments=()
          while IFS= read -r environment; do
            env_name="$(jq --raw-output '."env-name"' <<< "$environment")"

            # Keep Terraform apps and exclude those not tagged for this environment.
            affected_projects="$(
              pnpm nx show projects \
                --affected \
                --type=app \
                --projects=tag:terraform \
                --exclude="!tag:env:$env_name" \
                --json
            )"

            if jq --exit-status 'length > 0' <<< "$affected_projects" > /dev/null; then
              affected_environments+=("$environment")
            fi
          done < <(jq --compact-output '.[]' <<< "$candidate_environments")

          if [ "${#affected_environments[@]}" -eq 0 ]; then
            environments='[]'
          else
            environments="$(
              printf '%s\n' "${affected_environments[@]}" |
                jq --slurp --compact-output '.'
            )"
          fi

          printf 'environments=%s\n' "$environments" >> "$GITHUB_OUTPUT"

  release-with-environment:
    name: ${{ matrix.target.github-environment }}
    needs: assess-affected-projects
    if: ${{ needs.assess-affected-projects.outputs.environments != '[]' }}
    runs-on: ["self-hosted", "${{ matrix.target.env-name }}"]
    environment: ${{ matrix.target.github-environment }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.assess-affected-projects.outputs.environments) }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup repository tools
        if: ${{ hashFiles('mise.toml') != '' }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          minimum_release_age: 7d

      - name: Cloud Login
        uses: pagopa/dx/actions/csp-login@main

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_CONFIG_STORE_DIR }}
          key: ${{ runner.os }}-pnpm-store-${{ github.workflow }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-${{ github.workflow }}-

      - name: Install dependencies
        run: |
          mise deps --skip pnpm
          pnpm --filter . ci

      - name: Set base and head SHAs for affected commands
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Apply Terraform projects
        env:
          ENV_NAME: ${{ matrix.target.env-name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            pnpm nx run-many \
              --target=apply \
              --projects=tag:terraform \
              --exclude="!tag:env:${ENV_NAME},bootstrapper-*,repository" \
              -- \
              -auto-approve \
              -input=false \
              -lock-timeout=120s
          else
            pnpm nx affected \
              --target=apply \
              --exclude="!tag:env:${ENV_NAME},bootstrapper-*,repository" \
              -- \
              -auto-approve \
              -input=false \
              -lock-timeout=120s
          fi
