name: Push modules to subrepo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/modules/**"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  detect-modules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Detect Modules to Push
    outputs:
      modules: ${{ steps.get-all-modules.outputs.resources || steps.get-modified-modules.outputs.resources }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get all modules
        id: get-all-modules
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: $/.github/actions/get-all-resources

      - name: Get modified modules
        id: get-modified-modules
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: $/.github/actions/get-modified-resources
        with:
          current_ref: ${{ github.event.before }}

  push-modified-modules:
    runs-on: ubuntu-latest
    needs: [detect-modules]
    permissions:
      contents: read
    if: always()
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-modules.outputs.modules ) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push module to subrepository
        id: push-to-subrepository
        uses: $/.github/actions/push-to-subrepo
        with:
          name: ${{ matrix.module }}
          github_pat: ${{ secrets.PUSH_TF_MODULES_PAT }}
