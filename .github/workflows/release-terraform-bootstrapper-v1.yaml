name: Bootstrapper Apply

on:
  workflow_call:
    inputs:
      environment:
        description: Environment where the resources will be deployed.
        type: string
        required: true

env:
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_STORAGE_USE_AZUREAD: true
  ROLE_ARN: ${{ secrets.ROLE_ARN }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_IN_AUTOMATION: true

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: bootstrapper-${{ inputs.environment }}-cd
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.environment }}-bootstrapper
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout

      - name: Get terraform version from .terraform-version file
        id: get-version
        uses: pagopa/dx/.github/actions/get-terraform-version@main

      - name: Setup Telemetry Session
        uses: pagopa/dx/actions/setup-telemetry@main

      - name: Cloud Login
        uses: pagopa/dx/actions/csp-login@main
        env:
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
          GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}

      - name: Terraform Setup
        uses: pagopa/dx/.github/actions/terraform-setup@main
        with:
          terraform_version: ${{ steps.get-version.outputs.terraform_version }}

      - name: Terraform Init
        working-directory: infra/bootstrapper/${{ inputs.environment }}
        run: terraform init -input=false

      - name: Start Terraform Apply telemetry span
        uses: pagopa/dx/actions/log-telemetry-event@main
        with:
          name: terraform-apply
          span_phase: start

      - name: Terraform Apply
        working-directory: infra/bootstrapper/${{ inputs.environment }}
        run: |
          set -o pipefail
          terraform apply -auto-approve -input=false

      - name: End Terraform Apply telemetry span
        if: always()
        uses: pagopa/dx/actions/log-telemetry-event@main
        with:
          name: terraform-apply
          span_phase: end

      - name: Set Telemetry Failure Result
        if: failure()
        run: echo "PIPELINE_RESULT=failure" >> "$GITHUB_ENV"
