name: Validate

on:
  workflow_call:

env:
  REFRESH_STATE_EVERY_SECONDS: 600 # 10 minutes
  PNPM_CONFIG_STORE_DIR: ~/.local/share/pnpm/store
  MISE_ENV: ""

jobs:
  gate:
    name: Fork PR Gate
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.evaluate.outputs.run }}
    steps:
      - name: Evaluate fork PR
        id: evaluate
        env:
          CURRENT_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_HEAD_REPO" ] && [ "$PR_HEAD_REPO" != "$CURRENT_REPO" ]; then
            echo "Blocking forked PR from $PR_HEAD_REPO"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  warn-missing-version-plans:
    name: Warn Missing Version Plans
    needs: gate
    if: ${{ github.event_name == 'pull_request' && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_APP_KEY }}
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Node.js
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "node pnpm"

      - name: Install dependencies
        run: pnpm --filter . ci

      - name: Warn missing version plan coverage
        uses: pagopa/dx/actions/nx-release@main
        with:
          app-slug: ${{ steps.generate-token.outputs.app-slug }}
          github-token: ${{ steps.generate-token.outputs.token }}

  assess-affected-projects:
    name: Affected Projects Assessment
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      affected-projects: ${{ steps.detect.outputs.affected-projects }}
      environments: ${{ steps.detect.outputs.environments }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "node pnpm"

      - name: Set base and head SHAs for affected commands
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Install dependencies
        run: pnpm --filter . ci

      # Avoid querying GitHub environments when the change does not affect any
      # Nx project, and let downstream jobs short circuit cleanly.
      - name: Assess affected projects and environments
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          affected_projects="$(pnpm nx show projects --affected --json)"
          if ! jq --exit-status 'length > 0' <<< "$affected_projects" > /dev/null; then
            echo "affected-projects=false" >> "$GITHUB_OUTPUT"
            echo "environments=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "affected-projects=true" >> "$GITHUB_OUTPUT"

          # GitHub environments named `infra-<env>-ci` or
          # `bootstrapper-<env>-cd` define which credentials and runner labels
          # are used for Terraform plans.
          candidate_environments="$(
            gh api \
              --paginate \
              --slurp \
              "/repos/$GITHUB_REPOSITORY/environments?per_page=100" |
              jq --compact-output '
              [
                .[].environments[]
                | select(.name | test("^(infra-.+-ci|bootstrapper-.+-ci)$"))
                | {
                    "github-environment": .name,
                    "env-name": (.name | split("-")[1])
                  }
              ]
            '
          )"

          affected_environments=()
          while IFS= read -r environment; do
            env_name="$(jq --raw-output '."env-name"' <<< "$environment")"

            # Keep Terraform apps and exclude those not tagged for this environment.
            affected_projects="$(
              pnpm nx show projects \
                --affected \
                --type=app \
                --projects=tag:terraform \
                --exclude="!tag:env:$env_name" \
                --json
            )"

            if jq --exit-status 'length > 0' <<< "$affected_projects" > /dev/null; then
              affected_environments+=("$environment")
            fi
          done < <(jq --compact-output '.[]' <<< "$candidate_environments")

          if [ "${#affected_environments[@]}" -eq 0 ]; then
            environments='[]'
          else
            environments="$(
              printf '%s\n' "${affected_environments[@]}" |
                jq --slurp --compact-output '.'
            )"
          fi

          printf 'environments=%s\n' "$environments" >> "$GITHUB_OUTPUT"

  code-review:
    name: No environment
    runs-on: ubuntu-24.04
    needs: [gate, assess-affected-projects]
    if: ${{ needs.gate.outputs.run == 'true' && needs.assess-affected-projects.outputs.affected-projects == 'true' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup repository tools
        if: ${{ hashFiles('mise.toml') != '' }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true

      - name: Sets the base and head SHAs required for `nx affected` command
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_CONFIG_STORE_DIR }}
          key: ${{ runner.os }}-pnpm-store-${{ github.workflow }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-${{ github.workflow }}-

      - name: Install dependencies
        run: mise deps

      - name: Cache Nx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nx/cache
            .nx/workspace-data
            !.nx/workspace-data/d
          key: ${{ runner.os }}-nx-cache-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-cache-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-
            ${{ runner.os }}-nx-cache-${{ github.workflow }}-

      - name: Sets the base and head SHAs required for `nx affected` command
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # We exclude all Terraform Apps from quality checks
      # because they require a dedicated environment to be initialized.
      # Their static checks (lint, test) run in the
      # "code-review-with-environment" job.
      - name: Run code quality checks on affected projects
        run: |
          EXCLUDE=$(nx show projects --affected --type=app --sep=, -p=tag:terraform)
          nx affected --exclude=$EXCLUDE -t=build,test,lint,shellcheck,typecheck,docker:build,fmt,validate,trivy,docs -c=ci

  code-review-with-environment:
    name: ${{ matrix.target.github-environment }}
    needs: assess-affected-projects
    if: ${{ needs.assess-affected-projects.outputs.environments != '[]' }}
    runs-on: ["self-hosted", "${{ matrix.target.env-name }}"]
    environment:
      name: ${{ matrix.target.github-environment }}
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.assess-affected-projects.outputs.environments) }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_STORAGE_USE_AZUREAD: true
      ROLE_ARN: ${{ secrets.ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
      GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
      GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0

      # Azure/AWS CLIs come from the repository mise.toml, not from the
      # self-hosted runner image. Install them before Cloud Login so
      # azure/login and aws-actions/configure-aws-credentials can find az/aws.
      - name: Setup repository tools
        if: ${{ hashFiles('mise.toml') != '' }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Enable experimental features to use "mise deps"
          experimental: true

      - name: Cloud Login
        uses: pagopa/dx/actions/csp-login@main

      # Mise deps for pnpm only performs a global "pnpm install".
      # Here we want to install only the root workspace dependencies,
      # so we handle it manually.
      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_CONFIG_STORE_DIR }}
          key: ${{ runner.os }}-pnpm-store-${{ github.workflow }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-${{ github.workflow }}-

      - name: Install dependencies
        run: |
          mise deps --skip pnpm
          pnpm --filter . ci

      - name: Sets the base and head SHAs required for `nx affected` command
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Generate Cache Key
        if: github.event_name == 'pull_request'
        id: cache-key
        env:
          GITHUB_ENVIRONMENT: ${{ matrix.target.github-environment }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Get current epoch time rounded to chosen window
          ENVIRONMENT_SLUG=$(echo "$GITHUB_ENVIRONMENT" | tr '/' '-')
          TIME_WINDOW=$(( $(date +%s) / $REFRESH_STATE_EVERY_SECONDS ))
          echo "cache-key=tfplan-pr${PR_NUMBER}-${ENVIRONMENT_SLUG}-${TIME_WINDOW}s" >> "$GITHUB_OUTPUT"

      # Restore PR TFPlan Cache (miss = first run or >10 minutes, hit = within 10 minutes)
      - name: Check for Cache
        if: github.event_name == 'pull_request'
        id: tfplan-pr-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tfplan-pr-cache/${{ matrix.target.github-environment }}/.pr_plan_marker
          key: ${{ steps.cache-key.outputs.cache-key }}

      - name: Set Terraform Refresh Flag
        id: set-refresh-flag
        env:
          CACHE_HIT: ${{ steps.tfplan-pr-cache.outputs.cache-hit }}
          MARKER_FILE: .tfplan-pr-cache/${{ matrix.target.github-environment }}/.pr_plan_marker
        run: |
          if [ "$CACHE_HIT" == "true" ]; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::State will NOT be refreshed"
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "::notice::State will be refreshed"

            mkdir -p "$(dirname "$MARKER_FILE")"
            echo "$(date)" > "$MARKER_FILE"
          fi

      - name: Run Terraform plan on affected environment projects
        env:
          ENV_NAME: ${{ matrix.target.env-name }}
          GITHUB_ENVIRONMENT: ${{ matrix.target.github-environment }}
          REFRESH: ${{ steps.set-refresh-flag.outputs.refresh }}
        run: |
          if [[ "$GITHUB_ENVIRONMENT" == "bootstrapper-prod-cd" ]]; then
            EXCLUDE="*,!bootstrapper-${ENV_NAME},!repository"
          elif [[ "$GITHUB_ENVIRONMENT" == bootstrapper-* ]]; then
            EXCLUDE="*,!bootstrapper-${ENV_NAME}"
          else
            EXCLUDE="!tag:env:${ENV_NAME},bootstrapper-*,repository"
          fi
          pnpm nx affected -t fmt,lint,test,trivy -c ci --exclude="$EXCLUDE" && \
            pnpm nx affected -t plan -c ci --refresh="$REFRESH" --exclude="$EXCLUDE"

      - name: Upload Terraform plan report
        if: ${{ always() && hashFiles('.dx-tasks/**/*.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-plan-${{ matrix.target.github-environment }}
          path: .dx-tasks
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: true

  report:
    name: Report
    needs: code-review-with-environment
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Download Terraform plan reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          path: .dx-tasks
          merge-multiple: true

      - name: Post Code Review Report
        uses: pagopa/dx/actions/run-dx-task@main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          task: reportPrComment
          payload: >-
            {
              "footer": "_Triggered by @${{ github.triggering_actor }}, commit: `${{ github.event.pull_request.head.sha }}`._",
              "issueNumber": ${{ github.event.pull_request.number }},
              "owner": "${{ github.event.repository.owner.login }}",
              "repo": "${{ github.event.repository.name }}",
              "searchPattern": "Code Review Report",
              "sourceUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "title": "Code Review Report"
            }
