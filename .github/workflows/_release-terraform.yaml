name: Release Terraform Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/resources/**"
      - ".github/workflows/_release-terraform.yaml"
      - ".github/workflows/release-terraform-v1.yaml"

jobs:
  release:
    permissions:
      contents: read
      actions: read
      id-token: write
      # release-terraform-v1 installs the repository dependencies to resolve
      # the affected Nx projects, and they may come from GitHub Packages.
      packages: read
    uses: $/.github/workflows/release-terraform-v1.yaml
    secrets: inherit
