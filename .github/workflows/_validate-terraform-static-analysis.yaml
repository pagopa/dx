name: Terraform Validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - infra/**
      - .terraform-version
      - .pre-commit-config.yaml
      - .trivyignore
permissions:
  pull-requests: write
  contents: read
jobs:
  tf_analysis:
    # Don't run in Changeset PRs
    if: ${{ github.actor != 'dx-pagopa-bot' }}
    uses: $/.github/workflows/static_analysis.yaml
    name: Terraform Validation
    secrets: inherit
    with:
      enable_modified_files_detection: true
      # pre_commit_tf_tag: v1.109.0@sha256:4a089517e6eaabaa002a7afed72e3c0cdca17b5950ed2e000cf2b0e96a47980e
