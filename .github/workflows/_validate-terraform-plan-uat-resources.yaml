name: Terraform plan on uat resources

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "infra/resources/uat/**"
      - "infra/resources/_modules/**"
      - ".github/workflows/_validate-terraform-plan-uat-resources.yaml"

jobs:
  code_review:
    uses: $/.github/workflows/infra_plan.yaml
    name: Terraform Plan
    secrets: inherit
    with:
      environment: uat
      base_path: "infra/resources"
      override_github_environment: infra-uat
      use_labels: true
      use_private_agent: true
