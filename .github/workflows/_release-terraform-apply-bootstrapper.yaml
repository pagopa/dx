name: Release Bootstrapper Infrastructure
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/bootstrapper/**"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    strategy:
      matrix:
        environment: ["dev", "uat", "prod"]
    uses: pagopa/dx/.github/workflows/release-terraform-bootstrapper-v1.yaml@5dd06bf87a5b37b0c1515b8c4891b53445f723c7 # main
    name: Release Bootstrapper (${{ matrix.environment }})
    secrets: inherit
    with:
      environment: "${{ matrix.environment }}"
