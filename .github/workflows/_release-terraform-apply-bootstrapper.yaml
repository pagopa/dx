name: Release Bootstrapper Infrastructure
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/bootstrapper/**"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    strategy:
      matrix:
        environment: ["dev", "uat", "prod"]
    uses: $/.github/workflows/release-terraform-bootstrapper-v1.yaml
    name: Release Bootstrapper (${{ matrix.environment }})
    secrets: inherit
    with:
      environment: "${{ matrix.environment }}"
