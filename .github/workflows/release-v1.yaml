name: Release

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to (e.g., app-prod-cd)"
        required: true
        type: string
        default: "app-prod-cd"
    secrets:
      github-token:
        description: "GitHub token for creating PRs and pushing commits. Should have contents:write and pull-requests:write permissions"
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: "true"
          fetch-depth: 0

      - name: Detect Release tool
        id: changeset-detect
        shell: bash
        run: |
          if [ -f ".changeset/config.json" ]; then
            echo "Detected Changesets for managing releases."
          else
            echo "::error:: No supported release tool detected. Please ensure Changesets is configured."
            exit 1
          fi

      - name: Setup Node.js
        id: node-setup
        uses: $/.github/actions/node-setup

      - name: Update npm (for provenance support)
        shell: bash
        run: npm install -g npm@11.8.0

      - name: Install dependencies (pnpm)
        if: steps.node-setup.outputs.package-manager == 'pnpm'
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (yarn)
        if: steps.node-setup.outputs.package-manager == 'yarn'
        shell: bash
        run: yarn install --immutable

      - name: Install dependencies (npm)
        if: steps.node-setup.outputs.package-manager == 'npm'
        shell: bash
        run: npm ci

      - name: Create Release Pull Request or Publish to npm
        id: release
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: ${{ steps.node-setup.outputs.package-manager }} run version
          publish: ${{ steps.node-setup.outputs.package-manager }} run release
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
          NPM_CONFIG_PROVENANCE: true
