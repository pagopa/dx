name: Ubuntu runner compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/node-setup/**
      - .github/scripts/ubuntu-compatibility.sh
      - actions/renew-tls-certificate/**
      - providers/**/.github/workflows/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime and TLS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NX_DAEMON: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record hosted image and ambient tools
        run: bash .github/scripts/ubuntu-compatibility.sh inventory

      - name: Check Corepack before selecting project Node
        run: bash .github/scripts/ubuntu-compatibility.sh bootstrap

      # Exercise the node-setup recipe without its floating @main reference or caches.
      - name: Detect package manager from this commit
        id: package-manager
        uses: ./actions/detect-node-package-manager

      - name: Select project Node without cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check project runtime
        env:
          PACKAGE_MANAGER: ${{ steps.package-manager.outputs.package-manager }}
        run: |
          test "$PACKAGE_MANAGER" = pnpm
          test "$(node --version)" = "v$(cat .node-version)"
          pnpm --version

      - name: Select the providers' Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Read repository Terraform version
        id: terraform-version
        uses: ./.github/actions/get-terraform-version

      - name: Select repository Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.terraform_version }}
          terraform_wrapper: false

      - name: Check Terraform CLI and Docker build/export
        run: |
          terraform version
          bash .github/scripts/ubuntu-compatibility.sh archives
          bash .github/scripts/ubuntu-compatibility.sh docker

      - name: Read the action's Python pin
        id: python-version
        run: |
          version="$(bash .github/scripts/ubuntu-compatibility.sh python-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the action's Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python-version.outputs.version }}

      - name: Install workspace dependencies without restored caches
        run: pnpm install --frozen-lockfile

      - name: Run TLS imports and CSR checks without Nx cache
        run: |
          python3 --version
          python3 -c 'import ssl; print(ssl.OPENSSL_VERSION)'
          pnpm nx test renew-tls-certificate --skipNxCache

      - name: Run provider unit tests without Nx cache
        env:
          CGO_ENABLED: "0"
          TF_ACC: ""
          AWS_EC2_METADATA_DISABLED: "true"
        run: pnpm nx run-many -t test -p provider-azure provider-aws --skipNxCache

      - name: Check PFX certificate conversion
        run: bash .github/scripts/ubuntu-compatibility.sh pfx

      - name: Encrypt a synthetic Terraform plan
        run: bash .github/scripts/ubuntu-compatibility.sh encrypt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/ubuntu-compatibility/
          if-no-files-found: error
          retention-days: 7

  decrypt:
    name: Cross-image decryption (${{ matrix.os }})
    needs: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ubuntu-probe-*
          path: ${{ runner.temp }}/ubuntu-compatibility-input

      - name: Decrypt fixtures produced by both images
        run: bash .github/scripts/ubuntu-compatibility.sh decrypt
