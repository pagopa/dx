name: Terraform apply on prod resources

on:
  workflow_dispatch:
jobs:
  deploy:
    uses: $/.github/workflows/infra_apply.yaml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    name: Prod - Deploy
    secrets: inherit
    with:
      environment: prod
      base_path: "infra/resources/"
      override_github_environment: infra-prod
      use_labels: true
      use_private_agent: true
