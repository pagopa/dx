name: Release

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to (e.g., app-prod-cd)"
        required: true
        type: string
        default: "app-prod-cd"
    secrets:
      GH_APP_CLIENT_ID:
        description: "Standard GitHub App Client ID, shared with validation"
        required: false
      GH_APP_KEY:
        description: "Standard GitHub App private key, shared with validation"
        required: false
      app-client-id:
        description: "Optional release-specific GitHub App Client ID; overrides GH_APP_CLIENT_ID when supplied with app-private-key"
        required: false
      app-private-key:
        description: "Optional release-specific GitHub App private key; overrides GH_APP_KEY when supplied with app-client-id"
        required: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
    steps:
      - name: Validate release App override
        shell: bash
        env:
          APP_CLIENT_ID: ${{ secrets.app-client-id }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
        run: |
          if { [ -n "$APP_CLIENT_ID" ] && [ -z "$APP_PRIVATE_KEY" ]; } ||
             { [ -z "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; }; then
            echo "::error::Provide both app-client-id and app-private-key, or neither to use GH_APP_CLIENT_ID and GH_APP_KEY."
            exit 1
          fi

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app-client-id || secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key || secrets.GH_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: "true"
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Detect Release tool
        id: nx-detect
        shell: bash
        run: |
          if [ -f "nx.json" ]; then
            echo "Detected Nx for managing releases."
          else
            echo "::error:: No supported release tool detected. Please ensure Nx is configured."
            exit 1
          fi

      - name: Setup Node.js
        id: node-setup
        uses: pagopa/dx/.github/actions/node-setup@main

      - name: Update npm (for provenance support)
        shell: bash
        run: npm install -g npm@11.8.0

      # DX packages come from GitHub Packages through pnpm's built-in `gh:`
      # alias. The action writes a private npmrc in runner.temp with the
      # expanded credential and exports NPM_CONFIG_USERCONFIG for the rest of
      # the job, so no step has to resolve a token placeholder. The job keeps
      # packages: write because the same token publishes the release.
      - name: Setup npm registry
        uses: pagopa/dx/actions/setup-npm-registry@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (pnpm)
        if: steps.node-setup.outputs.package-manager == 'pnpm'
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (yarn)
        if: steps.node-setup.outputs.package-manager == 'yarn'
        shell: bash
        run: yarn install --immutable

      - name: Install dependencies (npm)
        if: steps.node-setup.outputs.package-manager == 'npm'
        shell: bash
        run: npm ci

      - name: Nx Publish
        uses: pagopa/dx/actions/nx-release@main
        env:
          # Terraform publishing mints a separate installation token for the destination organization.
          GH_APP_CLIENT_ID: ${{ secrets.app-client-id || secrets.GH_APP_CLIENT_ID }}
          GH_APP_KEY: ${{ secrets.app-private-key || secrets.GH_APP_KEY }}
        with:
          app-slug: ${{ steps.generate-token.outputs.app-slug }}
          github-token: ${{ steps.generate-token.outputs.token }}
