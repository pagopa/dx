name: Terraform apply on dev resources

on:
  workflow_dispatch:
jobs:
  dev_itn_common_deploy:
    uses: $/.github/workflows/infra_apply.yaml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    name: Dev - Deploy
    secrets: inherit
    with:
      environment: dev
      base_path: "infra/resources/"
      override_github_environment: infra-dev
      use_labels: true
      use_private_agent: true
