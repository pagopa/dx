[tools]
act = "0.2"
go = "1.27"
golangci-lint = "2.14.0"
jq = "1.8"
shellcheck = "0.11"
terraform-docs = "0.24"
tflint = "0.64"
trivy = "0.75"
uv = "0.13"
azure-cli = "2.91"
aws-cli = "2.37"

[tools.github-cli]
version = "latest"
postinstall = "gh extension install seachicken/gh-poi"

[env]
TFLINT_PLUGIN_DIR = "{{config_root}}/.tflint.d/plugins"

[tasks]
install = "uv sync --all-packages"
lock = "uv lock"

[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm", "python", "terraform"]
minimum_release_age = "7d"
experimental = true
lockfile = true

[deps.tflint]
sources = [".tflint.hcl"]
outputs = [".tflint.d/plugins"]
run = "tflint --init"

[deps.pnpm]
