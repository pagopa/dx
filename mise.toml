[tools]
acli = "latest"
act = "latest"
aws-cli = { version = "2.36", symlink_bins = "true" }
azure-cli = { version = "2.87", uvx_args = "--prerelease=allow" }
copilot = "latest"
github-cli = { version = "latest", postinstall = "gh extension install seachicken/gh-poi" }
go = "1.26"
golangci-lint = "2.12.2"
jq = "1.8"
"npm:nx" = "23.1"
pre-commit = "4.6"
qdns = "latest"
ripgrep = "latest"
shellcheck = "0.11"
terraform-docs = "0.24"
tflint = "0.63"
trivy = "0.71"
uv = "latest"

[env]
TFLINT_PLUGIN_DIR="{{config_root}}/.tflint.d/plugins"

[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm", "python", "terraform"]
minimum_release_age = "7d"
minimum_release_age_excludes = ["copilot", "github-cli"]
experimental = true
lockfile = true

[deps.tflint]
sources = [".tflint.hcl"]
outputs = [".tflint.d/plugins"]
run = "tflint --init"

[deps.pnpm]
