[build-system]
# Prevent unreviewed build-backend upgrades from entering the trusted build path.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-copilot"
version = "0.1.0"
description = "PagoPA Harbor extensions: custom Copilot CLI agent (CopilotCliMod) used by harbor-bench."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "harbor==0.22.0",
]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
