name: Code Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  validate:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: write
    uses: pagopa/dx/.github/workflows/validate-v2.yaml@main
    secrets:
      ARM_CLIENT_ID: $\{{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: $\{{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: $\{{ secrets.ARM_TENANT_ID }}
      AWS_REGION: $\{{ secrets.AWS_REGION }}
      GH_APP_CLIENT_ID: $\{{ secrets.GH_APP_CLIENT_ID }}
      GH_APP_INSTALLATION_ID: $\{{ secrets.GH_APP_INSTALLATION_ID }}
      GH_APP_KEY: $\{{ secrets.GH_APP_KEY }}
      GH_APP_RELEASE_APP_KEY: $\{{ secrets.GH_APP_RELEASE_APP_KEY }}
      GH_APP_RELEASE_CLIENT_ID: $\{{ secrets.GH_APP_RELEASE_CLIENT_ID }}
      ROLE_ARN: $\{{ secrets.ROLE_ARN }}
