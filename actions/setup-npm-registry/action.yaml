name: Setup npm registry
description: Authenticate npm and pnpm to the GitHub Packages registry that hosts DX packages.

runs:
  using: composite
  steps:
    - name: Authenticate to GitHub Packages
      shell: bash
      run: |
        set -euo pipefail

        # The credential is stored as a placeholder and expanded by npm and
        # pnpm at install time, so no secret is ever written to disk. Only the
        # user-level npmrc expands environment variables: the repository-level
        # one does not.
        npmrc="$HOME/.npmrc"
        # mktemp creates the rewritten file as private (0600) and mv keeps that
        # mode, so replacing an existing npmrc never widens its permissions.
        tempNpmrc="$(mktemp)"

        # Keep the action idempotent by dropping entries written by a previous
        # run before appending the current one.
        if [[ -f "$npmrc" ]]; then
          grep -v -F '//npm.pkg.github.com/:_authToken=' "$npmrc" > "$tempNpmrc" || true
        fi

        printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> "$tempNpmrc"
        mv "$tempNpmrc" "$npmrc"
