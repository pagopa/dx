name: Setup npm registry
description: Authenticate npm and pnpm to the GitHub Packages registry that hosts DX packages.

inputs:
  token:
    description: "Token with packages:read on the GitHub Packages registry, or packages:write when publishing."
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate to GitHub Packages
      shell: bash
      env:
        # Passed through the environment instead of being interpolated into the
        # script, so the token never shows up in the generated shell command.
        GITHUB_PACKAGES_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        if [[ -z "${GITHUB_PACKAGES_TOKEN:-}" ]]; then
          echo "::error::setup-npm-registry requires a non-empty token input." >&2
          exit 1
        fi

        # The token is expanded here, once, instead of storing a ${VAR}
        # placeholder that npm and pnpm resolve on every run. A placeholder is
        # re-evaluated by each npm and pnpm invocation that loads the file, so
        # any step that cannot see the variable prints
        # "Failed to replace env in config: ${...}". Expanding it at write time
        # makes the file self-contained and keeps the other steps quiet.
        #
        # The file lives in $RUNNER_TEMP, which the runner wipes at the start of
        # every job: the credential never reaches the persistent $HOME of a
        # self-hosted runner, so it cannot leak into a later job.
        npmrc="$RUNNER_TEMP/dx-npmrc"

        # Create every file as private (0600), including the npmrc below.
        umask 077
        tempNpmrc="$(mktemp)"

        # Keep the action idempotent by dropping entries written by a previous
        # run before appending the current one.
        if [[ -f "$npmrc" ]]; then
          grep -v -F '//npm.pkg.github.com/:_authToken=' "$npmrc" > "$tempNpmrc" || true
        fi

        printf '%s\n' "//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_TOKEN}" >> "$tempNpmrc"
        mv "$tempNpmrc" "$npmrc"

        # Point the rest of the job at the file, so consumers configure a single
        # variable: the token. npm and pnpm read it as the user-level npmrc,
        # which means $HOME/.npmrc is ignored from this step on.
        echo "NPM_CONFIG_USERCONFIG=$npmrc" >> "$GITHUB_ENV"
