name: "Manage Container App Staging Label"
description: "Assign a stable staging URL to a Container App revision, or remove the label only when owned by that revision."

inputs:
  operation:
    description: "Label operation: add or remove."
    required: true
  container_app_name:
    description: "Azure Container App name."
    required: true
  resource_group_name:
    description: "Azure resource group name."
    required: true
  revision_name:
    description: "Explicit candidate revision name, not latest."
    required: true

outputs:
  staging_url:
    description: "Stable HTTPS staging URL, returned when adding the label."
    value: ${{ steps.label.outputs.staging_url }}

runs:
  using: composite
  steps:
    - name: Manage staging label
      id: label
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        CONTAINER_APP_NAME: ${{ inputs.container_app_name }}
        RESOURCE_GROUP_NAME: ${{ inputs.resource_group_name }}
        REVISION_NAME: ${{ inputs.revision_name }}
      run: bash "$GITHUB_ACTION_PATH/staging-label.sh" "$OPERATION" "$CONTAINER_APP_NAME" "$RESOURCE_GROUP_NAME" "$REVISION_NAME"
