name: "Mise Setup"
description: "Use a pre-installed mise binary to set up repository tools"

outputs:
  enabled:
    description: "Whether mise was available and repository tools were set up"
    value: ${{ steps.detect.outputs.enabled }}
  version:
    description: "The detected mise version"
    value: ${{ steps.detect.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Detect mise
      id: detect
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v mise >/dev/null; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice::mise is not installed; skipping repository tool setup"
          exit 0
        fi

        version=$(mise --version | awk 'NR == 1 { print $1 }')
        if [ -z "$version" ]; then
          echo "::error::Unable to detect the installed mise version"
          exit 1
        fi

        echo "enabled=true" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup repository tools
      if: ${{ steps.detect.outputs.enabled == 'true' }}
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      with:
        version: ${{ steps.detect.outputs.version }}
