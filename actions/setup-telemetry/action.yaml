name: "Setup Telemetry"
description: "Initialize telemetry session and flush queued events in post"

inputs:
  operation_id:
    description: "Shared operation key for jobs in one trace; hashed to a 32-character OpenTelemetry trace ID. Omit for an independent trace."
    required: false
  span_name:
    description: "Name of the job span. Defaults to the workflow name."
    required: false
  connection_string:
    description: "Azure Application Insights connection string"
    required: false
    default: "InstrumentationKey=e0ff8094-78fa-45e5-a21d-e62b453dc5d1;IngestionEndpoint=https://italynorth-0.in.applicationinsights.azure.com/;LiveEndpoint=https://italynorth.livediagnostics.monitor.azure.com/;ApplicationId=ce469d55-2ff7-4dfd-a249-cc787291e672"

runs:
  using: "node24"
  main: "dist/index.cjs"
  post: "dist/post.cjs"
